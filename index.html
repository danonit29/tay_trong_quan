<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tay Trong Quần — Trắc Nghiệm Sử</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080c;
    --fg:#f4f4f8;
    --muted:rgba(244,244,248,.5);
    --accent:#ff9f43;
    --accent-2:#ff6b6b;
    --accent-3:#6c5ce7;
    
    --success:#1dd1a1;
    --error:#ff6b6b;

    --card-w: min(240px, 66vw);
    --card-gap: 16px;

    --ease-out-quint:cubic-bezier(.22,1,.36,1);
    --ease-spring:cubic-bezier(.34,1.56,.64,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}

  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }

  /* AURORA */
  .aurora{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    contain:strict;
  }
  .aurora::before,.aurora::after{
    content:'';position:absolute;border-radius:50%;
    will-change:transform;
  }
  .aurora::before{
    width:80vmax;height:80vmax;
    left:-25vmax;top:-20vmax;
    background:radial-gradient(circle, rgba(255,159,67,.32) 0%, rgba(255,159,67,.08) 40%, transparent 70%);
    animation:drift1 22s ease-in-out infinite alternate;
  }
  .aurora::after{
    width:90vmax;height:90vmax;
    right:-35vmax;bottom:-30vmax;
    background:radial-gradient(circle, rgba(108,92,231,.36) 0%, rgba(108,92,231,.08) 45%, transparent 70%);
    animation:drift2 26s ease-in-out infinite alternate;
  }
  @keyframes drift1{
    0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(6vw,4vh,0) scale(1.12);}
  }
  @keyframes drift2{
    0%{transform:translate3d(0,0,0) scale(1);}
    100%{transform:translate3d(-5vw,-6vh,0) scale(1.08);}
  }

  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
    contain:strict;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  /* Screens */
  .screen{
    position:fixed;inset:0;z-index:2;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transition:opacity .6s var(--ease-out-quint),transform .6s var(--ease-out-quint),filter .6s var(--ease-out-quint);
  }
  .screen.hidden{opacity:0;transform:scale(1.02);filter:blur(12px);pointer-events:none;}
  
  /* Scrollable screens */
  #menu, #quiz, #review { overflow-y: auto; justify-content: flex-start; padding: 30px 20px; -webkit-overflow-scrolling: touch; }
  #menu::-webkit-scrollbar, #quiz::-webkit-scrollbar, #review::-webkit-scrollbar { width: 4px; }
  #menu::-webkit-scrollbar-thumb, #quiz::-webkit-scrollbar-thumb, #review::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

  /* MÀN 1 */
  #intro{cursor:pointer;}
  #greeting{
    display:flex;flex-wrap:wrap;justify-content:center;
    font-size:clamp(1.6rem,7vw,5.5rem);
    font-weight:800;letter-spacing:-.02em;line-height:1.1;
    padding:0 24px;text-align:center;
  }
  #greeting span{
    display:inline-block;opacity:0;
    background:linear-gradient(180deg,#fff 30%,var(--accent) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:charIn .8s var(--ease-spring) forwards;
    will-change:transform,opacity,filter;
  }
  @keyframes charIn{
    from{opacity:0;transform:translateY(40px) rotate(-8deg) scale(.6);filter:blur(8px);}
    to{opacity:1;transform:translateY(0) rotate(0) scale(1);filter:blur(0);}
  }
  .skip-hint{
    position:absolute;bottom:max(48px,env(safe-area-inset-bottom));
    font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);
    opacity:0;animation:fadeIn .8s 1.4s forwards;
  }
  @keyframes fadeIn{to{opacity:1;}}

  /* MÀN 2: CHỌN THÀNH VIÊN */
  #pick{gap:14px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
  .pick-header{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 24px;}
  .pick-title{
    font-size:clamp(1.3rem,6vw,2.2rem);font-weight:800;letter-spacing:-.02em;text-align:center;
    background:linear-gradient(90deg,#fff 0%,var(--accent) 50%,#fff 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 5s linear infinite;
  }
  @keyframes shine{to{background-position:200% center;}}
  .pick-sub{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}

  .slider{
    position:relative;display:flex;align-items:center;gap:var(--card-gap);
    width:100%;padding-block:28px;padding-inline:calc((100vw - var(--card-w)) / 2);
    overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
    touch-action:pan-x;cursor:grab;
  }
  .slider::-webkit-scrollbar{display:none;}
  .slider.dragging{cursor:grabbing;scroll-snap-type:none;}

  .card{ --p:0; flex:0 0 auto; width:var(--card-w); scroll-snap-align:center; scroll-snap-stop:always; contain:content; }
  .card-inner{
    border-radius:22px;
    background:linear-gradient(150deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,.02) 55%, rgba(255,255,255,.05) 100%), #15152a;
    border:1px solid rgba(255,255,255,.08);overflow:hidden;position:relative;cursor:pointer;
    transform:translate3d(0, calc(-8px * var(--p)), 0) scale(calc(0.87 + 0.13 * var(--p)));
    opacity:calc(0.4 + 0.6 * var(--p));
    transition:border-color .3s ease, box-shadow .3s ease;
    will-change:transform, opacity;backface-visibility:hidden;
  }
  .avatar{
    aspect-ratio:1/1.1;display:flex;align-items:center;justify-content:center;
    font-size:clamp(66px,19vw,100px);position:relative;overflow:hidden;background: #15152a;
  }
  .avatar::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%,rgba(8,8,12,.9) 100%);pointer-events:none;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;position:relative;z-index:1;object-position:center;}
  .avatar .emo{
    position:relative;z-index:1;filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
    transform:scale(calc(0.92 + 0.12 * var(--p)));will-change:transform;
  }
  .name{
    padding:10px 14px 18px;text-align:center;font-weight:700;font-size:1rem;letter-spacing:-.01em;
    position:relative;z-index:2;margin-top:-44px;text-shadow:0 2px 12px rgba(0,0,0,.9);
  }
  .tag{
    position:absolute;top:12px;left:12px;font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    background:rgba(8,8,12,.55);padding:5px 10px;border-radius:999px;
    border:1px solid rgba(255,255,255,.12);z-index:3;
  }
  .card.selected .card-inner{
    border-color:rgba(255,159,67,.6);
    box-shadow:0 0 0 1px rgba(255,159,67,.4), 0 0 40px rgba(255,159,67,.4), 0 20px 40px rgba(0,0,0,.5);
  }
  .card.selected .card-inner::before{
    content:'✓';position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0a0f;font-weight:800;font-size:.95rem;
    display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 0 24px rgba(255,159,67,.7);
    animation:pop .4s var(--ease-spring);
  }
  @keyframes pop{from{transform:scale(0);opacity:0;}to{transform:scale(1);opacity:1;}}

  .dots{display:flex;gap:6px;align-items:center;height:14px;}
  .dot{
    width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);border:none;padding:0;cursor:pointer;
    transition:all .4s var(--ease-out-quint);
  }
  .dot.active{width:22px;border-radius:999px;background:var(--accent);box-shadow:0 0 12px rgba(255,159,67,.6);}

  .confirm{
    margin-top:6px;padding:15px 34px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0a0f;font-size:1rem;font-weight:800;
    cursor:pointer;opacity:0;transform:translateY(20px) scale(.9);pointer-events:none;
    transition:all .5s var(--ease-spring);box-shadow:0 10px 30px rgba(255,107,107,.35);
    font-family:inherit;position:relative;overflow:hidden;
  }
  .confirm::before{
    content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);
    transform:translateX(-100%);transition:transform .6s var(--ease-out-quint);
  }
  .confirm:hover::before{transform:translateX(100%);}
  .confirm.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .confirm:active{transform:scale(.96);}

  /* MÀN 3: DONE */
  #done{gap:16px;text-align:center;padding:0 32px;}
  #done .big{font-size:clamp(1rem,4.5vw,1.2rem);font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}
  #done .who{
    font-size:clamp(1.8rem,8vw,3rem);font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(180deg,#fff 20%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #done .note{font-size:.85rem;color:var(--muted);max-width:340px;line-height:1.7;}

  /* COMMON BUTTONS */
  .btn-primary{
    padding:15px 34px;border:none;border-radius:999px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#0a0a0f;
    font-size:1rem;font-weight:800;cursor:pointer;font-family:inherit;
    box-shadow:0 10px 30px rgba(255,107,107,.35);transition:all .3s var(--ease-out-quint);
  }
  .btn-primary:active{transform:scale(.96);}
  .btn-ghost{
    padding:12px 26px;border-radius:999px;background:transparent;border:1px solid rgba(255,255,255,.15);
    color:var(--fg);font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;
    transition:all .3s var(--ease-out-quint);
  }
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-ghost:active{transform:scale(.97);}
  .btn-sm{padding:8px 18px;font-size:.8rem;}

  /* ===== MÀN 4: MENU BÀI TẬP ===== */
  .menu-container{width:100%;max-width:480px;display:flex;flex-direction:column;gap:24px;margin-top:40px;}
  .menu-header{text-align:center;}
  .menu-title{
    font-size:clamp(1.5rem,6vw,2rem);font-weight:800;
    background:linear-gradient(180deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .menu-user{font-size:.9rem;color:var(--muted);margin-top:4px;}
  
  .lesson-list{display:flex;flex-direction:column;gap:16px;}
  .lesson-card{
    display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    cursor:pointer;transition:all .3s var(--ease-out-quint);
  }
  .lesson-card:hover{
    background:rgba(255,255,255,.08);border-color:rgba(255,159,67,.4);transform:translateY(-2px);
    box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  .lesson-card:active{transform:scale(.98);}
  .lesson-icon{
    width:50px;height:50px;border-radius:14px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;
    box-shadow:0 4px 16px rgba(255,159,67,.4);
  }
  .lesson-info{flex:1;}
  .lesson-name{font-size:1.1rem;font-weight:700;}
  .lesson-desc{font-size:.75rem;color:var(--muted);margin-top:2px;}
  .lesson-arrow{font-size:1.2rem;color:var(--muted);}

  /* ===== MÀN 5: LÀM BÀI ===== */
  .quiz-container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:24px;margin-top:20px;}
  .quiz-header{display:flex;align-items:center;gap:12px;}
  .quiz-progress{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
  .quiz-progress-bar{
    height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent-2));
    border-radius:99px;transition:width .4s var(--ease-out-quint);
  }
  .quiz-counter{font-size:.9rem;font-weight:700;color:var(--muted);min-width:40px;text-align:right;}
  
  .quiz-body{
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:24px;padding:24px;
  }
  .question-text{font-size:1.05rem;line-height:1.6;font-weight:600;margin-bottom:24px;}
  .options-list{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    cursor:pointer;transition:all .2s ease;
  }
  .option:hover:not(.disabled){background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.2);}
  .option.disabled{cursor:default;}
  .opt-label{font-weight:800;color:var(--muted);min-width:20px;}
  .opt-text{font-size:.95rem;line-height:1.4;color:var(--fg);}
  
  /* States */
  .option.selected{border-color:rgba(255,159,67,.5);}
  .option.correct{background:rgba(29,209,161,.15);border-color:var(--success);}
  .option.correct .opt-label{color:var(--success);}
  .option.wrong{background:rgba(255,107,107,.15);border-color:var(--error);}
  .option.wrong .opt-label{color:var(--error);}
  .option.correct .opt-text{color:var(--success);}
  .option.wrong .opt-text{color:var(--error);}
  
  .feedback{
    margin-top:20px;padding:14px 16px;border-radius:12px;
    font-size:.9rem;font-weight:600;line-height:1.5;
    display:flex;align-items:flex-start;gap:10px;
  }
  .feedback.correct{background:rgba(29,209,161,.1);color:var(--success);border:1px solid rgba(29,209,161,.3);}
  .feedback.wrong{background:rgba(255,107,107,.1);color:var(--error);border:1px solid rgba(255,107,107,.3);}
  .feedback .icon{font-weight:900;font-size:1.1rem;}
  .feedback strong{color:#fff;font-weight:700;}
  .feedback.hidden{display:none;}
  
  .quiz-footer{display:flex;justify-content:flex-end;}
  .quiz-footer .btn-primary.hidden{display:none;}

  /* ===== MÀN 6: TỔNG KẾT ===== */
  .result-container{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;}
  .result-circle{
    width:140px;height:140px;border-radius:50%;
    background:conic-gradient(var(--accent) 0%, var(--accent-2) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 0 40px rgba(255,159,67,.3);position:relative;
  }
  .result-circle::before{
    content:'';position:absolute;inset:6px;border-radius:50%;background:var(--bg);
  }
  .result-score{font-size:2.5rem;font-weight:800;line-height:1;position:relative;z-index:1;}
  .result-total{font-size:.9rem;color:var(--muted);position:relative;z-index:1;}
  
  .result-eval{
    font-size:1.6rem;font-weight:800;padding:8px 24px;border-radius:12px;
    text-transform:uppercase;letter-spacing:.05em;
  }
  
  /* Ảnh kết quả */
  .result-img {
    width: 180px;
    height: 180px;
    border-radius: 20px;
    object-fit: cover;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    opacity: 0;
    transform: scale(0.8) translateY(20px);
    transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    display: none;
  }
  .result-img.show {
    display: block;
    opacity: 1;
    transform: scale(1) translateY(0);
  }
  
  .result-actions{display:flex;gap:12px;margin-top:16px;}

  /* ===== MÀN 7: XEM LẠI ===== */
  .review-container{width:100%;max-width:600px;display:flex;flex-direction:column;gap:24px;margin-top:20px;}
  .review-header{display:flex;justify-content:space-between;align-items:center;}
  .review-header h2{font-size:1.3rem;font-weight:800;}
  .review-list{display:flex;flex-direction:column;gap:20px;padding-bottom:40px;}
  .review-item{
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
    border-radius:20px;padding:20px;
  }
  .review-q{font-size:.95rem;font-weight:600;line-height:1.5;margin-bottom:16px;}
  .review-item .option{padding:10px 12px;font-size:.9rem;pointer-events:none;}
  .review-answer{margin-top:14px;font-size:.85rem;font-weight:600;line-height:1.5;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);}
  .icon-check{color:var(--success);font-weight:900;margin-left:auto;}
  .icon-x{color:var(--error);font-weight:900;margin-left:auto;}
</style>
</head>
<body>

<div class="aurora"></div>
<div class="grain"></div>

<!-- MÀN 1 -->
<div id="intro" class="screen">
  <h1 id="greeting"></h1>
  <div class="skip-hint">bấm để bỏ qua</div>
</div>

<!-- MÀN 2 -->
<div id="pick" class="screen hidden">
  <div class="pick-header">
    <div class="pick-title">Mày là thằng l nào?</div>
    <div class="pick-sub">vuốt để tìm bản thân</div>
  </div>
  <div class="slider" id="slider"></div>
  <div class="dots" id="dots"></div>
  <button class="confirm" id="confirmBtn"></button>
</div>

<!-- MÀN 3 -->
<div id="done" class="screen hidden">
  <div class="big">Chốt</div>
  <div class="who" id="doneName"></div>
  <div class="note">Danh tính đã ghi nhận. Bài tập Sử đã sẵn sàng.</div>
  <button class="btn-primary" id="enterBtn" style="margin-top:16px;">Vào học →</button>
  <button class="btn-ghost" id="backBtn" style="margin-top:8px;">← chọn lại</button>
</div>

<!-- MÀN 4: MENU BÀI TẬP -->
<div id="menu" class="screen hidden">
  <div class="menu-container">
    <div class="menu-header">
      <div class="menu-title">Chọn Bài Tập</div>
      <div class="menu-user" id="menuUser"></div>
    </div>
    <div class="lesson-list">
      <div class="lesson-card" onclick="startQuiz()">
        <div class="lesson-icon">📜</div>
        <div class="lesson-info">
          <div class="lesson-name">Bài 1: Liên Hợp Quốc</div>
          <div class="lesson-desc">20 câu hỏi trắc nghiệm</div>
        </div>
        <div class="lesson-arrow">→</div>
      </div>
    </div>
  </div>
</div>

<!-- MÀN 5: LÀM BÀI -->
<div id="quiz" class="screen hidden">
  <div class="quiz-container">
    <div class="quiz-header">
      <div class="quiz-progress">
        <div class="quiz-progress-bar" id="quizProgressBar"></div>
      </div>
      <div class="quiz-counter"><span id="quizCurrent">1</span>/20</div>
    </div>
    <div class="quiz-body" id="quizBody"></div>
    <div class="quiz-footer">
      <button class="btn-primary hidden" id="nextBtn" onclick="nextQuestion()">Tiếp tục</button>
    </div>
  </div>
</div>

<!-- MÀN 6: TỔNG KẾT -->
<div id="result" class="screen hidden">
  <div class="result-container">
    <div class="result-circle">
      <div class="result-score" id="resultScore">0</div>
      <div class="result-total">/20</div>
    </div>
    
    <div class="result-eval" id="resultEval"></div>
    <!-- Ảnh chèn thêm theo yêu cầu -->
    <img id="resultImg" class="result-img" src="" alt="Minh họa">
    
    <div class="result-actions">
      <button class="btn-primary" onclick="showReview()">Xem lại bài</button>
      <button class="btn-ghost" onclick="backToMenu()">Về Menu</button>
    </div>
  </div>
</div>

<!-- MÀN 7: XEM LẠI -->
<div id="review" class="screen hidden">
  <div class="review-container">
    <div class="review-header">
      <h2>Xem Lại Bài Làm</h2>
      <button class="btn-ghost btn-sm" onclick="backToResult()">← Quay lại</button>
    </div>
    <div class="review-list" id="reviewList"></div>
  </div>
</div>

<script>
/* ============================================================
   DỮ LIỆU THÀNH VIÊN

/* ============ STATE ============ */
let cards         = [];
let cardCenters   = [];
let falloffDist   = 0;
let selectedIndex = null;
let dragged       = false;
let introDone     = false;
let activeDot     = INITIAL_INDEX;
let rafId         = 0;
let scrollAnimId  = 0;

/* ============================================================
   PHẦN 1: CHÀO
   ============================================================ */
const GREET_TEXT = 'chào thằng l';

function playGreeting(){
  greetingEl.innerHTML = '';
  [...GREET_TEXT].forEach((ch, i) => {
    const s = document.createElement('span');
    s.textContent = (ch === ' ') ? '\u00A0' : ch;
    s.style.animationDelay = (0.18 + i * 0.06) + 's';
    greetingEl.appendChild(s);
  });
  const totalMs = (0.18 + GREET_TEXT.length * 0.06 + 0.8) * 1000;
  setTimeout(goToPick, totalMs + 500);
}

function goToPick(){
  if (introDone) return;
  introDone = true;
  measureGeometry();
  centerOnIndex(INITIAL_INDEX, true);
  updateProgress();
  introEl.classList.add('hidden');
  pickEl.classList.remove('hidden');
}
introEl.addEventListener('click', goToPick);

/* ============================================================
   PHẦN 2: CHỌN THÀNH VIÊN
   ============================================================ */
function renderMembers(){
  const frag = document.createDocumentFragment();
  MEMBERS.forEach((m, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    const avatarContent = m.img
      ? `<img src="${m.img}" alt="${m.name}" draggable="false" loading="lazy">`
      : `<span class="emo">${m.emoji || '👤'}</span>`;
    card.innerHTML = `
      <div class="card-inner">
        <div class="tag">#${i + 1}</div>
        <div class="avatar" style="background:linear-gradient(140deg,${m.c1},${m.c2})">${avatarContent}</div>
        <div class="name">${m.name}</div>
      </div>`;
    card.addEventListener('click', () => {
      if (dragged) return;
      selectMember(i);
    });
    frag.appendChild(card);
  });
  sliderEl.appendChild(frag);
  cards = Array.prototype.slice.call(sliderEl.children);
}

function renderDots(){
  const frag = document.createDocumentFragment();
  MEMBERS.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot';
    d.addEventListener('click', () => scrollToCard(i));
    frag.appendChild(d);
  });
  dotsEl.appendChild(frag);
  updateActiveDot(activeDot);
}

function updateActiveDot(i){
  if (i === activeDot && dotsEl.children[i]?.classList.contains('active')) return;
  activeDot = i;
  const dots = dotsEl.children;
  for (let k = 0; k < dots.length; k++) dots[k].classList.toggle('active', k === i);
}

function measureGeometry(){
  const n = cards.length;
  cardCenters.length = n;
  falloffDist = 0;
  for (let i = 0; i < n; i++){
    const c = cards[i];
    cardCenters[i] = c.offsetLeft + c.offsetWidth / 2;
    if (c.offsetWidth > falloffDist) falloffDist = c.offsetWidth;
  }
  falloffDist += (parseFloat(getComputedStyle(sliderEl).columnGap) || 16);
}

function targetScrollFor(i){
  const c = cards[i];
  return c.offsetLeft - (sliderEl.clientWidth - c.offsetWidth) / 2;
}

function centerOnIndex(i, instant){
  if (instant) sliderEl.scrollLeft = targetScrollFor(i);
  else smoothScrollTo(targetScrollFor(i));
  updateActiveDot(i);
}

function updateProgress(){
  const viewCenter = sliderEl.scrollLeft + sliderEl.clientWidth / 2;
  let bestIdx = 0, bestDist = Infinity;
  for (let i = 0; i < cards.length; i++){
    const dist = Math.abs(cardCenters[i] - viewCenter);
    if (dist < bestDist){ bestDist = dist; bestIdx = i; }
    let p = 1 - dist / falloffDist;
    if (p < 0) p = 0;
    const inv = 1 - p;
    cards[i].style.setProperty('--p', 1 - inv * inv * inv);
  }
  if (bestIdx !== activeDot) updateActiveDot(bestIdx);
}

sliderEl.addEventListener('scroll', () => {
  if (rafId) return;
  rafId = requestAnimationFrame(() => { rafId = 0; updateProgress(); });
}, { passive:true });

function smoothScrollTo(target, duration = 460){
  cancelAnimationFrame(scrollAnimId);
  const start = sliderEl.scrollLeft;
  const delta = target - start;
  if (Math.abs(delta) < 0.5) return;
  sliderEl.classList.add('dragging');
  const t0 = performance.now();
  function step(now){
    const t = Math.min((now - t0) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 5);
    sliderEl.scrollLeft = start + delta * eased;
    if (t < 1) scrollAnimId = requestAnimationFrame(step);
    else sliderEl.classList.remove('dragging');
  }
  scrollAnimId = requestAnimationFrame(step);
}

function scrollToCard(i){
  smoothScrollTo(targetScrollFor(i));
  updateActiveDot(i);
}

/* Mouse Drag */
let isDown = false, startX = 0, startScroll = 0, lastX = 0, lastT = 0, velocity = 0;
sliderEl.addEventListener('pointerdown', (e) => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  cancelAnimationFrame(scrollAnimId);
  isDown = true; dragged = false;
  startX = e.clientX; lastX = e.clientX; lastT = performance.now();
  startScroll = sliderEl.scrollLeft; velocity = 0;
  sliderEl.classList.add('dragging');
});
window.addEventListener('pointermove', (e) => {
  if (!isDown) return;
  const dx = e.clientX - startX;
  if (Math.abs(dx) > 6) dragged = true;
  sliderEl.scrollLeft = startScroll - dx;
  const now = performance.now(), dt = now - lastT;
  if (dt > 0) velocity = velocity * 0.7 + ((e.clientX - lastX) / dt) * 0.3;
  lastX = e.clientX; lastT = now;
}, { passive:true });
window.addEventListener('pointerup', () => {
  if (!isDown) return;
  isDown = false;
  if (!dragged){ sliderEl.classList.remove('dragging'); return; }
  let v = -velocity * 16;
  const decay = 0.93;
  function inertia(){
    v *= decay;
    if (Math.abs(v) < 0.6) { snapToNearest(); return; }
    sliderEl.scrollLeft += v;
    requestAnimationFrame(inertia);
  }
  requestAnimationFrame(inertia);
  setTimeout(() => { dragged = false; }, 80);
});

function snapToNearest(){
  const viewCenter = sliderEl.scrollLeft + sliderEl.clientWidth / 2;
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < cardCenters.length; i++){
    const d = Math.abs(cardCenters[i] - viewCenter);
    if (d < bestDist){ bestDist = d; best = i; }
  }
  smoothScrollTo(targetScrollFor(best), 380);
  updateActiveDot(best);
}

window.addEventListener('resize', () => {
  if (!pickEl.classList.contains('hidden')) {
    measureGeometry();
    centerOnIndex(activeDot, true);
    updateProgress();
  }
});

function selectMember(i){
  selectedIndex = i;
  for (let k = 0; k < cards.length; k++) cards[k].classList.toggle('selected', k === i);
  scrollToCard(i);
  confirmBtn.textContent = `Chốt, tao là ${MEMBERS[i].name} →`;
  confirmBtn.classList.add('show');
  if (navigator.vibrate) navigator.vibrate(18);
}

confirmBtn.addEventListener('click', () => {
  if (selectedIndex === null) return;
  const chosen = MEMBERS[selectedIndex];
  currentUser = chosen.name;
  try {
    localStorage.setItem('tayTrongQuan.member', JSON.stringify({ index: selectedIndex, name: chosen.name }));
  } catch (err){}
  doneName.textContent = chosen.name;
  pickEl.classList.add('hidden');
  doneEl.classList.remove('hidden');
});

document.getElementById('enterBtn').addEventListener('click', () => {
  doneEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
  document.getElementById('menuUser').textContent = `Chào ${currentUser},`;
});

document.getElementById('backBtn').addEventListener('click', () => {
  doneEl.classList.add('hidden');
  pickEl.classList.remove('hidden');
  measureGeometry();
  setTimeout(() => {
    centerOnIndex(selectedIndex ?? INITIAL_INDEX, true);
    updateProgress();
  }, 60);
});

/* ============================================================
   PHẦN 3: LOGIC LÀM BÀI
   ============================================================ */
function startQuiz() {
  currentQuestionIdx = 0;
  userAnswers = new Array(QUESTIONS.length).fill(null);
  menuEl.classList.add('hidden');
  quizEl.classList.remove('hidden');
  renderQuestion(0);
}

function renderQuestion(index) {
  currentQuestionIdx = index;
  const q = QUESTIONS[index];
  const body = document.getElementById('quizBody');
  
  document.getElementById('quizCurrent').textContent = index + 1;
  document.getElementById('quizProgressBar').style.width = ((index) / QUESTIONS.length * 100) + '%';
  
  let optionsHtml = '';
  q.options.forEach((opt, i) => {
    optionsHtml += `
      <div class="option" onclick="selectAnswer(${i})" data-index="${i}">
        <span class="opt-label">${String.fromCharCode(65 + i)}.</span>
        <span class="opt-text">${opt}</span>
      </div>`;
  });
  
  body.innerHTML = `
    <div class="question-text">Câu ${index + 1}: ${q.q}</div>
    <div class="options-list">${optionsHtml}</div>
    <div class="feedback hidden" id="feedback"></div>
  `;
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.add('hidden');
  if (index === QUESTIONS.length - 1) nextBtn.textContent = 'Xem kết quả';
  else nextBtn.textContent = 'Tiếp tục';
}

function selectAnswer(optIndex) {
  if (userAnswers[currentQuestionIdx] !== null) return;
  userAnswers[currentQuestionIdx] = optIndex;
  
  const q = QUESTIONS[currentQuestionIdx];
  const isCorrect = optIndex === q.correct;
  const opts = document.querySelectorAll('#quizBody .option');
  
  opts.forEach((el, i) => {
    el.classList.add('disabled');
    el.onclick = null;
    if (i === q.correct) el.classList.add('correct');
    if (i === optIndex && !isCorrect) el.classList.add('wrong');
    if (i === optIndex) el.classList.add('selected');
  });
  
  const feedback = document.getElementById('feedback');
  feedback.classList.remove('hidden');
  if (isCorrect) {
    feedback.className = 'feedback correct';
    feedback.innerHTML = `<span class="icon">✓</span> Chính xác!`;
  } else {
    feedback.className = 'feedback wrong';
    feedback.innerHTML = `<span class="icon">✗</span> Sai rồi. Đáp án đúng là: <strong>${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</strong>`;
  }
  
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  if (currentQuestionIdx < QUESTIONS.length - 1) {
    renderQuestion(currentQuestionIdx + 1);
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  quizEl.classList.add('hidden');
  resultEl.classList.remove('hidden');
  
  let correctCount = 0;
  userAnswers.forEach((ans, i) => { if (ans === QUESTIONS[i].correct) correctCount++; });
  
  const percent = (correctCount / QUESTIONS.length) * 100;
  document.getElementById('resultScore').textContent = correctCount;
  
  const evalEl = document.getElementById('resultEval');
  const imgEl = document.getElementById('resultImg');
  
  // Xóa class show cũ để reset animation
  imgEl.classList.remove('show');
  
  if (percent < 70) {
    evalEl.textContent = 'l ngu';
    evalEl.style.color = 'var(--error)';
    evalEl.style.textShadow = '0 0 20px rgba(255,107,107,.5)';
    
    // Ảnh dưới 70% là qminh2.png
    imgEl.src = 'lon/qminh2.png';
  } else {
    evalEl.textContent = 'gút chóp';
    evalEl.style.color = 'var(--success)';
    evalEl.style.textShadow = '0 0 20px rgba(29,209,161,.5)';
    
    // Ảnh trên 70% là mhai2.webp
    imgEl.src = 'lon/mhai2.webp';
  }
  
  // Đợi 1 xíu để chạy animation hiện ảnh
  setTimeout(() => {
    imgEl.classList.add('show');
  }, 100);
}

    q.options.forEach((opt, optIdx) => {
      let cls = 'option disabled';
      if (optIdx === q.correct) cls += ' correct';
      if (optIdx === userAns && !isCorrect) cls += ' wrong';
      
      let icon = '';
      if (optIdx === q.correct) icon = '<span class="icon-check">✓</span>';
      else if (optIdx === userAns && !isCorrect) icon = '<span class="icon-x">✗</span>';
      
      optionsHtml += `
        <div class="${cls}">
          <span class="opt-label">${String.fromCharCode(65 + optIdx)}.</span>
          <span class="opt-text">${opt}</span>
          ${icon}
        </div>`;
    });
    
    html += `
      <div class="review-item">
        <div class="review-q">Câu ${i + 1}: ${q.q}</div>
        <div class="options-list">${optionsHtml}</div>
        <div class="review-answer">
          ${isCorrect 
            ? '<span style="color:var(--success)">✓ Bạn chọn đúng</span>' 
            : `<span style="color:var(--error)">✗ Bạn chọn sai. Đáp án đúng: ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}</span>`
          }
        </div>
      </div>`;
  });
  
  list.innerHTML = html;
}

function backToResult() {
  reviewEl.classList.add('hidden');
  resultEl.classList.remove('hidden');
}

function backToMenu() {
  resultEl.classList.add('hidden');
  menuEl.classList.remove('hidden');
}

/* ============================================================
   KHỞI ĐỘNG
   ============================================================ */
renderMembers();
renderDots();
playGreeting();
</script>
</body>
